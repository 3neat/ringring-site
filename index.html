<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ring Ring</title>
  <meta name="description" content="Ring Ring is a card game for two to four players, each on their own phone.">
  <link rel="icon" href="icon.jpg">
  <style>
    body{margin:0;min-height:100vh;background:radial-gradient(120% 80% at 50% 40%,#1a6a45 0%,#0f4d33 58%,#093022 100%);color:#f3ece0;font:19px/1.4 "Arial Narrow",system-ui,sans-serif}
    main{max-width:480px;margin:0 auto;padding:56px 24px;text-align:center}
    img{width:128px;height:128px;border-radius:29px;box-shadow:0 8px 22px rgba(0,0,0,.5)}
    h1{font-size:44px;letter-spacing:.14em;text-transform:uppercase;margin:18px 0 4px}
    p{margin:10px 0;color:#dcebe0}
    nav{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap}
    a{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border:2px solid #f1e6c6;border-radius:6px;color:#f1e6c6;text-decoration:none;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:16px}
    small{display:block;margin-top:36px;color:#dcebe0}
  </style>
</head>
<body>
  <main>
    <img src="icon.jpg" alt="Ring Ring app icon: four cards around a brass bell">
    <h1>Ring Ring</h1>
    <p>A card game for two to four players, each on their own phone.</p>
    <p>Invite friends with one link, race to 111 points, and dodge the Ring Ring.</p>
    <nav>
      <a href="privacy/">Privacy Policy</a>
      <a href="support/">Support</a>
    </nav>
    <small>Ring Ring is in private beta.</small>
